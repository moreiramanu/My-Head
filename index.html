<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Head</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="stars">
    <div class="layer-2" id="starsSmall"></div>
    <div class="layer-3" id="starsBig"></div>
  </div>

  <div class="moon"></div>
  <div class="shooting-star"></div>

  <div class="content">
    <p class="quote">
      "Perhaps the reason this night looks so beautiful is not because of these stars or lights, <span class="highlight">but because of us.</span>"
    </p>
    <div class="signature">BTS - Mikrokosmos</div>
  </div>
  <script>
    function generateStars(count) {
      let shadows = [];
      for (let i = 0; i < count; i++) {
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        shadows.push(`${x}vw ${y}vh var(--star)`);
      }
      return shadows.join(', ');
    }

    document.documentElement.style.setProperty('--stars-small', generateStars(120));
    document.documentElement.style.setProperty('--stars-big', generateStars(40));
  </script>

</body>
</html>
